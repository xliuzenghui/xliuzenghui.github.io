short_bio: >-
 
  <p>
    你好, Hello, こんにちは, Bonjour, Привет, Hallo, مرحبا, नमस्ते, 안녕하세요, Ciao.
  I'm Liu Zenghui. I'm a incoming PhD student at <a href="https://www.ubc.ca/">University of British Columbia</a>. My supervisors are <a href="https://engineering.ok.ubc.ca/about/contact/kasun-hewage/">Kasun Hewage</a> and <a href="https://engineering.ok.ubc.ca/about/contact/rehan-sadiq/">Rehan Sadiq</a>.Recently, I am a Part-time Research Assistant at Peking University, supervised by <a href="https://ues.pku.edu.cn/jszy/wzc/wzcgrjl/4dfe7d9067274cd0b69560e7fe145900.htm">Prof.Zhecheng Wang</a>，Because my student visa was randomly put under a security review, based on past experience, there could be a 12-24 month delay. I completed my master's studies at the <a href="https://tiei2014.tju.edu.cn/">School of Future Technology</a>, <a href="http://www.tju.edu.cn">Tianjin University</a>, and the supervisor of my master's program is Professor <a href="https://arch.tju.edu.cn/info/1186/3163.htm">Gang Liu</a>. <strong>In the Future, I will devote myself to research on resilience, sustainability, and equity of complex urban systems.</strong>  In my spare time, I play basketball, table tennis, Guan Dan (a kind of card game), listen to music, and play the guitar (for indie music lovers).
  </p>


